# Clipper default configuration.
# Do not edit this file for personal settings: create configs/local.yaml (git-ignored)
# containing only the keys you want to override, e.g.
#
#   transcription: {model: medium}
#   selection: {max_clips: 6}
#
# Every key is validated at startup; unknown keys are rejected so typos are caught.

paths:
  projects_dir: projects          # default output/project root (relative to the app folder)
  ffmpeg_path: null               # null = find "ffmpeg" on PATH (or FFMPEG_PATH env var)
  ffprobe_path: null

performance:
  mode: normal                    # normal | low  (low = fewer threads, smaller contexts, lower priority; slower)
  cpu_threads: 0                  # 0 = automatic
  low_priority: false             # run ffmpeg at below-normal priority (forced on in "low" mode)

transcription:
  model: small                    # tiny | base | small | medium | large-v2 (bigger = slower, more VRAM)
  device: auto                    # auto | cuda | cpu
  compute_type: auto              # auto | float16 | int8_float16 | int8 | float32
  language: null                  # null = auto-detect, or an ISO code such as "en"
  beam_size: 5
  vad_filter: true
  allow_cpu_fallback: true        # fall back to CPU int8 (and tell you) when the GPU fails / runs out of memory

audio:
  window_s: 0.5
  min_silence_s: 0.8
  silence_floor_db: -50.0
  sustained_threshold: 0.75       # normalised energy (0-1) that counts as "high"
  sustained_min_s: 3.0
  change_sigma: 2.5               # energy jump (in std-devs) that counts as a sudden change
  peak_prominence: 0.25

scenes:
  enabled: true
  threshold: 0.30                 # ffmpeg scene score, 0-1 (higher = fewer cuts)
  keyframes_only: false           # much faster, coarser (forced on in performance "low" mode)
  max_thumbnails: 120

llm:
  host: http://127.0.0.1:11434
  allow_remote_host: false        # refuse non-loopback hosts unless explicitly enabled (privacy guard)
  model: qwen3:4b                 # alternatives: qwen3:1.7b (constrained), qwen3:8b (needs ~6+ GB free VRAM)
  num_ctx: 8192
  num_predict: 1800
  temperature: 0.3
  seed: 7
  keep_alive: 5m
  timeout_s: 300
  max_retries: 2                  # extra attempts after a malformed response
  section_seconds: 600            # transcript is cut into sections of at most this length ...
  section_overlap_s: 90           # ... overlapping by this much, so moments at the seams survive
  section_max_words: 1400
  scoring_batch_size: 4
  use_llm: true                   # false = deterministic-only fallback (no semantic understanding; see docs)

boundaries:
  pad_before_s: 0.25
  pad_after_s: 0.35
  sentence_snap_s: 3.0            # how far a boundary may move to land on a sentence edge
  reaction_lead_in_s: 8.0         # audio-triggered "reaction" moments: max setup included before the peak

selection:
  min_duration_s: 15
  max_duration_s: 60
  target_duration_s: 40
  overflow_tolerance: 1.2         # complete moments may exceed max by this factor (with a warning)
  max_clips: 10
  min_score: 45                   # 0-100
  min_separation_s: 15            # gap between selected moments
  diversity_penalty: 6            # score points subtracted per already-selected clip of the same category
  category_preferences: {}        # e.g. {funny: 1.1, quote: 0.9}  (multipliers on the score)

scoring:
  weights:
    hook: 0.22
    clarity: 0.18
    completeness: 0.18
    payoff: 0.17
    escalation: 0.08
    format_fit: 0.09
    av_suitability: 0.08

subtitles:
  enabled: true
  mode: karaoke                   # karaoke (active-word highlight) | plain (conventional captions)
  font: Arial
  font_size: 78                   # in output pixels at 1080x1920
  bold: true
  primary_color: "#FFFFFF"
  highlight_color: "#FFE135"
  outline_color: "#000000"
  outline_px: 5
  shadow_px: 2
  position: bottom                # bottom | middle | top
  margin_v_pct: 0.20              # distance from the edge, as a fraction of video height (keeps clear of app UI)
  margin_h_pct: 0.07
  max_words: 4
  max_chars: 26
  pause_s: 0.45                   # a pause this long starts a new caption
  uppercase: false
  pop_animation: true

render:
  mode: blur                      # blur | smart_crop | original
  width: 1080
  height: 1920
  crf: 20
  preset: veryfast
  audio_bitrate: 160k
  hardware_encoding: auto         # auto (use NVENC only if a test encode succeeds) | never
  blur_sigma: 24
  background_dim: 0.15
  preview_width: 540
  preview_height: 960
  preview_crf: 30

smart_crop:
  detector: face                  # face | person | none   (OpenCV built-ins; no extra downloads)
  sample_interval_s: 0.75
  min_detection_ratio: 0.25       # below this share of frames with a subject -> centre crop
  deadband_pct: 0.10              # ignore subject movement smaller than this fraction of the source width
  smoothing: 0.35                 # 0 = static, 1 = follows every sample
  max_keypoints: 24

export:
  write_srt: true
  write_metadata: true

logging:
  level: INFO
